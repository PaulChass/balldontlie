name: Deploy

# Déploiement automatique à chaque merge sur master (et déclenchement manuel possible).
# Build du front en CI, puis mise à jour du serveur via SSH :
#   git pull + cache:clear (back) et scp du bundle public/build (front).
#
# Secrets/variables attendus dans l'environnement GitHub « production » :
#   secrets   : SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, DEPLOY_PATH
#   variables : SSH_PORT (optionnel, défaut 22)
# La clé publique correspondant à SSH_PRIVATE_KEY doit être dans
# ~/.ssh/authorized_keys sur le serveur.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: yarn

      - name: Install front dependencies
        run: yarn install --frozen-lockfile

      - name: Build front (encore production)
        run: yarn build

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          # Écrit la clé en retirant d'éventuels retours chariot Windows (CRLF),
          # qui font échouer le parsing OpenSSH ("error in libcrypto").
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Validation précoce : message clair si la clé est illisible ou protégée par passphrase.
          if ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY illisible : régénère une clé ed25519 SANS passphrase et recolle tout le contenu (lignes BEGIN/END incluses)."
            exit 1
          fi

      - name: Update back on server (git pull + cache clear)
        env:
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && git pull origin master && php bin/console cache:clear --env=prod"

      - name: Upload front bundle (public/build)
        env:
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=accept-new -r \
            public/build "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/public/"
